name: check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: python3 scripts/generate-protocol.py --check
      - run: ./gradlew build :dui-pack:componentDocs --console=plain
      - run: git diff --exit-code -- docs/generated
