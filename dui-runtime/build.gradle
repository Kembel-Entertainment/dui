dependencies {
    api project(':dui-core')
    api "net.kyori:adventure-api:${rootProject.adventureVersion}"
    api "net.kyori:adventure-nbt:${rootProject.adventureVersion}"
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation project(':dui-test')
}
tasks.named('jar') {
    from(rootProject.file('LICENSE')) { into 'META-INF/dui' }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) { into 'META-INF/dui' }
}
